<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Chunk</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📌</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f5f3ef; --card: #ffffff; --card-2: #fbfaf7;
    --ink: #201f1c; --ink-2: #6b6862; --ink-3: #96938b; --line: #e6e2da;
    --accent: #2f5d50; --accent-soft: #dcece6;
    --shadow: 0 1px 2px rgba(32,31,28,0.04), 0 8px 20px -10px rgba(32,31,28,0.14);
    --tag1-bg:#dbe9fb; --tag1-tx:#1d4ed8;
    --tag2-bg:#f4e1f2; --tag2-tx:#a1348f;
    --tag3-bg:#fde3cf; --tag3-tx:#b45309;
    --tag4-bg:#d8f1ea; --tag4-tx:#0f766e;
    --tag5-bg:#e2f0d6; --tag5-tx:#3f7d20;
    --tag6-bg:#fbdfe0; --tag6-tx:#b91c3c;
    --tag7-bg:#e7e2fb; --tag7-tx:#5b3fc4;
    --tag-gray-bg:#eae7e0; --tag-gray-tx:#5c5952;
    --pin-bg: #fff7dd; --pin-line: #ecdca3;
    --check-border: #b5b0a2;
    --glow-p1: 217,45,45; --glow-p2: 205,110,20; --glow-p3: 45,140,80; --glow-reminder: 90,90,220;
    --reminder-bg: #ece9ff; --reminder-line: #cfc8f7;
    --edit-outline: #171717;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --card: #201f22; --card-2: #262528;
      --ink: #f1efe9; --ink-2: #b3afa5; --ink-3: #817e77; --line: #34322f;
      --accent: #7bbfa9; --accent-soft: #223a33;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 24px -12px rgba(0,0,0,0.55);
      --tag1-bg:#1d3554; --tag1-tx:#8fb6f5;
      --tag2-bg:#432b40; --tag2-tx:#e2a0d7;
      --tag3-bg:#4a3018; --tag3-tx:#f0af6a;
      --tag4-bg:#12352e; --tag4-tx:#7fd6c2;
      --tag5-bg:#28381a; --tag5-tx:#a4d97e;
      --tag6-bg:#452027; --tag6-tx:#f2909c;
      --tag7-bg:#2c2650; --tag7-tx:#b6a6f2;
      --tag-gray-bg:#302e2a; --tag-gray-tx:#b3afa5;
      --pin-bg: #2c2712; --pin-line: #4a3f1c;
      --check-border: rgba(255,255,255,0.55);
      --glow-p1: 240,90,90; --glow-p2: 235,150,60; --glow-p3: 90,200,140; --glow-reminder: 150,140,255;
      --reminder-bg: #26234a; --reminder-line: #423d78;
      --edit-outline: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --card: #201f22; --card-2: #262528;
    --ink: #f1efe9; --ink-2: #b3afa5; --ink-3: #817e77; --line: #34322f;
    --accent: #7bbfa9; --accent-soft: #223a33;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 24px -12px rgba(0,0,0,0.55);
    --tag1-bg:#1d3554; --tag1-tx:#8fb6f5;
    --tag2-bg:#432b40; --tag2-tx:#e2a0d7;
    --tag3-bg:#4a3018; --tag3-tx:#f0af6a;
    --tag4-bg:#12352e; --tag4-tx:#7fd6c2;
    --tag5-bg:#28381a; --tag5-tx:#a4d97e;
    --tag6-bg:#452027; --tag6-tx:#f2909c;
    --tag7-bg:#2c2650; --tag7-tx:#b6a6f2;
    --tag-gray-bg:#302e2a; --tag-gray-tx:#b3afa5;
    --pin-bg: #2c2712; --pin-line: #4a3f1c;
    --check-border: rgba(255,255,255,0.55);
    --glow-p1: 240,90,90; --glow-p2: 235,150,60; --glow-p3: 90,200,140; --glow-reminder: 150,140,255;
    --reminder-bg: #26234a; --reminder-line: #423d78;
    --edit-outline: #ffffff;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 90px; display: none; }
  html.mc-unlocked .wrap { display: block; }

  .lock-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 20px; }
  html.mc-unlocked .lock-screen { display: none; }
  .lock-box { width: 100%; max-width: 300px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 30px 24px; box-shadow: var(--shadow); text-align: center; display: flex; flex-direction: column; gap: 10px; }
  .lock-icon { font-size: 2rem; line-height: 1; }
  .lock-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.2rem; color: var(--ink); }
  .lock-sub { color: var(--ink-2); font-size: 0.85rem; margin: 0 0 4px; }
  .lock-input { width: 100%; border: 1px solid var(--line); background: var(--card-2); color: var(--ink); border-radius: 10px; padding: 11px 13px; font-family: 'IBM Plex Mono', monospace; font-size: 1.1rem; text-align: center; letter-spacing: 0.14em; }
  .lock-btn { border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 0.9rem; border-radius: 10px; padding: 10px 14px; cursor: pointer; margin-top: 2px; }
  .lock-btn:hover { opacity: 0.92; }
  .lock-error { color: #b91c3c; font-size: 0.78rem; min-height: 1em; }

  .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 7px; }
  .brand .pin-ico { font-size: 1.1rem; }
  .search { flex: 1 1 220px; min-width: 160px; }
  .search input { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 13px; font-family: 'Public Sans', sans-serif; font-size: 0.88rem; }
  .search input::placeholder { color: var(--ink-3); }
  .sync-badge { display: inline-flex; align-items: center; gap: 7px; font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px 5px 9px; white-space: nowrap; }
  .sync-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .sync-badge.is-error .dot { background: #b91c3c; }
  .sync-badge.is-loading .dot { animation: pulse 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .sync-badge .dot { animation: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .date-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--ink-2); white-space: nowrap; }
  .theme-toggle-btn { padding: 6px 10px; font-size: 0.95rem; line-height: 1; }

  .tagbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tag-chip { font-family: 'Public Sans', sans-serif; font-size: 0.82rem; font-weight: 600; background: var(--card); color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  .tag-chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .viewbar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .viewbar select, .filter-select { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 8px; padding: 6px 9px; font-family: 'Public Sans', sans-serif; font-size: 0.8rem; }
  .filter-select.is-filtered { border-color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink); color: var(--ink); font-weight: 600; }
  .view-toggle-btn { display: inline-flex; align-items: center; justify-content: center; padding: 7px 10px; }
  .view-icon { display: inline-grid; }
  .view-icon-grid { grid-template-columns: repeat(2, 6px); grid-template-rows: repeat(2, 6px); gap: 3px; }
  .view-icon-grid i { display: block; width: 6px; height: 6px; border-radius: 1px; background: currentColor; opacity: 0.75; }
  .view-icon-list { display: flex; flex-direction: column; justify-content: center; gap: 3px; width: 16px; }
  .view-icon-list i { display: block; height: 2.5px; width: 100%; border-radius: 1px; background: currentColor; opacity: 0.75; }

  .section-label { display: flex; align-items: center; gap: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 0.78rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); margin: 22px 0 10px; }
  .section-label .count { font-family: 'IBM Plex Mono', monospace; color: var(--ink-3); font-weight: 400; text-transform: none; letter-spacing: 0; }

  .section-header { margin: 22px 0 4px; }
  .section-title-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .section-title-group { display: flex; align-items: center; gap: 10px; }
  .section-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0; }
  .section-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; color: var(--ink); }
  .view-tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .view-tab { border: none; background: var(--card); color: var(--ink-2); font-family: 'Public Sans', sans-serif; font-weight: 700; font-size: 0.85rem; padding: 8px 16px; cursor: pointer; }
  .view-tab + .view-tab { border-left: 1px solid var(--line); }
  .tab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 3px; border-radius: 999px; background: #b91c3c; color: #fff; font-size: 0.68rem; font-weight: 700; line-height: 1; vertical-align: middle; }
  .tab-count:empty { display: none; }
  .view-tab.is-active { background: var(--accent); color: #fff; }
  .view-tab:disabled { opacity: 0.4; cursor: not-allowed; }
  .filter-group { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .section-edit-btn { display: none; align-items: center; justify-content: center; width: 27px; height: 27px; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #111; cursor: pointer; font-size: 0.85rem; padding: 0; line-height: 1; flex: none; }
  .section-edit-btn.is-visible { display: inline-flex; }
  .section-edit-btn:hover { background: #f0f0f0; }
  .color-picker-row { display: none; flex-direction: column; align-items: flex-start; gap: 10px; margin: 10px 0 4px; }
  .color-picker-row .swatch-row { display: flex; align-items: center; gap: 9px; }
  .color-swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; padding: 0; }
  .color-swatch.is-active { border-color: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.45); }
  .rename-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .rename-row input[type="text"] { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 10px; font-family: 'Public Sans', sans-serif; font-size: 0.82rem; flex: 1 1 200px; max-width: 260px; }
  .rename-row button { border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 0.78rem; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .rename-row button:disabled { opacity: 0.5; cursor: default; }
  .rename-row .rename-hint { font-size: 0.72rem; color: var(--ink-3); }

  .wall { columns: 250px; column-gap: 14px; }
  .note { break-inside: avoid; margin-bottom: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 14px; box-shadow: var(--shadow); }
  .note.is-pinned { background: var(--pin-bg); border-color: var(--pin-line); }
  .note.is-removing { opacity: 0.3; }
  .note.p1 { border: 1.5px solid rgba(var(--glow-p1), 0.8); }
  .note.p2 { border: 1.5px solid rgba(var(--glow-p2), 0.8); }
  .note.p3 { border: 1.5px solid rgba(var(--glow-p3), 0.8); }
  .note.pR { border: 1.5px solid rgba(var(--glow-reminder), 0.8); background: var(--reminder-bg); }

  .note-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
  .note-date { font-size: 0.7rem; color: var(--ink-3); }
  .note-actions { display: flex; align-items: center; gap: 7px; flex: none; }
  .note-edit-btn { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; border: 1px solid #ccc; background: #fff; color: #111; cursor: pointer; font-size: 0.72rem; padding: 0; line-height: 1; flex: none; opacity: 0; transition: opacity 0.12s ease; }
  .note-edit-btn:hover { background: #f0f0f0; }
  .note:hover .note-edit-btn, .task-row:hover .note-edit-btn, .note-edit-btn:focus-visible { opacity: 1; }
  @media (hover: none) { .note-edit-btn { opacity: 1; } }
  .note-check { width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--check-border); background: var(--card-2); cursor: pointer; appearance: none; -webkit-appearance: none; position: relative; flex: none; }
  .note-check:hover { border-color: var(--accent); }
  .note-check:checked { background: var(--accent); border-color: var(--accent); }
  .note-check:checked::after { content: ""; position: absolute; left: 5px; top: 1px; width: 4px; height: 8px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }

  .note-title { font-weight: 600; font-size: 0.94rem; line-height: 1.35; margin-bottom: 10px; }
  .note-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .pill { font-family: 'Public Sans', sans-serif; font-size: 0.7rem; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .pill-who { background: var(--tag-gray-bg); color: var(--tag-gray-tx); font-weight: 500; }
  .pill-reminder { background: rgba(var(--glow-reminder), 0.18); color: rgb(var(--glow-reminder)); }
  .note-icon-btn { cursor: pointer; font-size: 0.82rem; opacity: 0.8; border: none; background: transparent; padding: 0; line-height: 1; }
  .note-icon-btn:hover { opacity: 1; }
  .note-expand { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .note-expand-text { font-size: 0.85rem; line-height: 1.5; color: var(--ink-2); white-space: pre-wrap; margin-bottom: 6px; }
  .note-expand-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .note-quick-edit-btn, .note-quick-close-btn, .note-quick-cancel-btn { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; border: 1px solid #ccc; background: #fff; color: #111; cursor: pointer; font-size: 0.7rem; padding: 0; line-height: 1; flex: none; }
  .note-quick-edit-btn:hover, .note-quick-close-btn:hover, .note-quick-cancel-btn:hover { background: #f0f0f0; }
  .note-quick-save-btn { border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 0.75rem; border-radius: 6px; padding: 5px 12px; cursor: pointer; flex: none; }
  .note-quick-save-btn:disabled { opacity: 0.5; cursor: default; }
  .note-quick-edit-input { width: 100%; border: 1px solid var(--line); background: var(--card-2); color: var(--ink); border-radius: 8px; padding: 7px 9px; font-family: 'Public Sans', sans-serif; font-size: 0.82rem; min-height: 54px; resize: vertical; margin-bottom: 6px; }
  .task-row.is-note-expanded { flex-direction: column; align-items: stretch; }
  .task-row-main { display: flex; align-items: center; gap: 10px; width: 100%; }

  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; box-shadow: var(--shadow); }
  .task-row.is-pinned { background: var(--pin-bg); border-color: var(--pin-line); }
  .task-row.is-removing { opacity: 0.3; }
  .task-row.p1 { border: 1.5px solid rgba(var(--glow-p1), 0.8); }
  .task-row.p2 { border: 1.5px solid rgba(var(--glow-p2), 0.8); }
  .task-row.p3 { border: 1.5px solid rgba(var(--glow-p3), 0.8); }
  .task-row.pR { border: 1.5px solid rgba(var(--glow-reminder), 0.8); background: var(--reminder-bg); }
  .task-row-title { flex: 1; font-weight: 600; font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-row-date { flex: none; font-size: 0.7rem; color: var(--ink-3); }

  .note.is-editing { border: 2px solid var(--edit-outline); }
  .edit-field-row { margin-bottom: 8px; }
  .edit-field-row:last-of-type { margin-bottom: 10px; }
  .edit-field-row input[type="text"], .edit-field-row select, .edit-field-row textarea {
    width: 100%; border: 1px solid var(--line); background: var(--card-2); color: var(--ink); border-radius: 8px; padding: 7px 9px; font-family: 'Public Sans', sans-serif; font-size: 0.82rem;
  }
  .edit-field-row textarea { min-height: 54px; resize: vertical; font-family: 'Public Sans', sans-serif; }
  .edit-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .edit-save-btn { border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 0.78rem; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  .edit-save-btn:disabled { opacity: 0.5; cursor: default; }
  .edit-cancel-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); font-weight: 600; font-size: 0.78rem; border-radius: 8px; padding: 6px 14px; cursor: pointer; }

  .compose { border: 1.5px dashed var(--line); border-radius: 13px; padding: 12px 14px; margin-bottom: 16px; background: var(--card-2); }
  .compose form { display: flex; flex-direction: column; gap: 8px; }
  .compose input[type="text"], .compose input[type="url"], .compose select { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 8px 10px; font-family: 'Public Sans', sans-serif; font-size: 0.85rem; }
  .compose-label { font-size: 0.78rem; font-weight: 600; color: var(--ink-2); }
  .compose .row2 { display: flex; gap: 8px; flex-wrap: wrap; }
  .compose .row2 select { flex: 0 0 auto; }
  .compose .row2 input { flex: 1 1 140px; }
  .compose button { align-self: flex-end; border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 0.82rem; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  .compose button:disabled { opacity: 0.5; }

  .empty-state, .status-state { text-align: center; padding: 50px 20px; color: var(--ink-2); }
  .status-state .mono, .empty-state .mono { display: block; margin-top: 8px; font-size: 0.78rem; color: var(--ink-3); }

  .closed-toggle-row { margin: 22px 0 4px; }
  .damage-type-filter-row { margin: 0 0 14px; }
  .closed-toggle-row .tag-chip { opacity: 0.9; }
  .closed-list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .closed-row { display: flex; align-items: center; gap: 10px; background: var(--card); padding: 8px 12px; font-size: 0.85rem; cursor: pointer; }
  .closed-row:hover { background: var(--card-2); }
  .closed-row:hover .closed-title { color: var(--ink); }
  .closed-check { flex: none; width: 16px; height: 16px; border-radius: 5px; background: var(--accent); color: #fff; font-size: 0.62rem; display: flex; align-items: center; justify-content: center; }
  .closed-hint { color: var(--ink-3); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 0.72rem; }
  .closed-title { flex: 1; color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .closed-date { flex: none; color: var(--ink-3); font-size: 0.72rem; }

  footer.note-foot { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 0.82rem; max-width: 60ch; }

  .meeting-card { cursor: pointer; }
  .note.meeting-card { border: 1.5px solid var(--edit-outline); }
  .meeting-body { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 0.85rem; line-height: 1.5; color: var(--ink-2); white-space: pre-wrap; }
  .damage-card.is-done { opacity: 0.55; }
  .damage-card.is-done .note-title { text-decoration: line-through; text-decoration-color: var(--ink-3); }
  .damage-row.is-done { opacity: 0.55; }
  .damage-row.is-done .task-row-title { text-decoration: line-through; text-decoration-color: var(--ink-3); }
  .unassigned-assign-row { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; gap: 8px; }
  .unassigned-assign-row select { flex: 1 1 auto; margin-bottom: 0 !important; }

(function () {
  var PIN = "44541742";
  var STORAGE_KEY = "mc-unlocked";
  var htmlEl = document.documentElement;
  function unlock() {
    // sessionStorage (not localStorage) - stays unlocked for refreshes/navigation within
    // this tab, but asks again once the tab or browser is closed and reopened.
    try { sessionStorage.setItem(STORAGE_KEY, "yes"); } catch (e) {}
    htmlEl.classList.add("mc-unlocked");
  }
  try {
    if (sessionStorage.getItem(STORAGE_KEY) === "yes") htmlEl.classList.add("mc-unlocked");

  document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('lockForm');

    if (!form) return;

        errorEl.style.display = '';
        input.value = '';
        input.focus();
